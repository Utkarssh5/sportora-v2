version: '3.8'

services:
  # 1. Database Service (MongoDB Atlas or Local Container)
  mongodb:
    image: mongo:latest
    container_name: sportora_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sportora-network

  # 2. Express Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sportora_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/sportora
      - JWT_SECRET=production_jwt_secret_sportora_v2
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - sportora-network

  # 3. Next.js Web App Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sportora_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/sportora
      - JWT_SECRET=production_jwt_secret_sportora_v2
    depends_on:
      - api
    networks:
      - sportora-network

# Defined Persistent Volumes
volumes:
  mongo_data:
    driver: local
  app_uploads:
    driver: local

# Defined Custom Network
networks:
  sportora-network:
    driver: bridge  
