name: Sportora V2 CI/CD

on:
  push:
    branches:
      - frontend-redesign

  pull_request:
    branches:
      - frontend-redesign

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Web
        working-directory: apps/web
        env:
          MONGODB_URI: "mongodb+srv://mock:mock@cluster.mongodb.net/test"
          JWT_SECRET: "ci_cd_test_secret"
        run: npm run build

      - name: Run Web Tests
        working-directory: apps/web
        run: npm run test

  deploy:
    name: Deploy to EC2
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/frontend-redesign'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "Starting Sportora production deployment"
            echo "========================================"

            cd ~/Projects/sportora-v2

            echo "Pulling latest code..."
            git pull origin frontend-redesign

            echo "Building API..."
            cd apps/api
            pnpm install --frozen-lockfile
            pnpm run build

            echo "Building Web..."
            cd ../web
            pnpm install --frozen-lockfile
            rm -rf .next
            pnpm run build

            echo "Restarting API..."
            PM2="/home/ubuntu/.local/share/pnpm/store/v11/links/@/pm2/7.0.4/426e76b7ecb4f81ffa39739a3166457267dcb4be9fa15f70b89742e823846417/node_modules/pm2/bin/pm2"
            $PM2 restart sportora-api

            echo "Restarting Web..."
            $PM2 restart sportora-web

            echo "Saving PM2 process list..."
            $PM2 save

            echo "Checking application status..."
            $PM2 status

            echo "========================================"
            echo "Sportora deployment completed!"
            echo "========================================"
