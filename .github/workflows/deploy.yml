name: Sportora V2 Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: LINT & TYPECHECK
  # -------------------------------------------------------------
  lint-and-typecheck:
    name: 🧹 Code Linting & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies (Web App)
        run: |
          cd apps/web
          npm ci

      - name: Run Next.js Build & Type Check
        run: |
          cd apps/web
          npm run build
        env:
          MONGODB_URI: "mongodb+srv://mock:mock@cluster.mongodb.net/test"
          JWT_SECRET: "ci_cd_production_test_secret"

  # -------------------------------------------------------------
  # JOB 2: AUTOMATED TESTS
  # -------------------------------------------------------------
  run-tests:
    name: 🧪 Automated Test Suite Execution
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Execute Tests
        run: |
          cd apps/web
          npm run test

  # -------------------------------------------------------------
  # JOB 3: MULTI-STAGE DOCKER BUILD & VERIFICATION
  # -------------------------------------------------------------
  docker-build-and-push:
    name: 🐳 Docker Multi-Stage Image Build
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web App Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: sportora/web:latest,sportora/web:${{ github.sha }}

      - name: Build API Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: sportora/api:latest,sportora/api:${{ github.sha }}

  # -------------------------------------------------------------
  # JOB 4: AUTOMATED PRODUCTION DEPLOYMENT
  # -------------------------------------------------------------
  deploy:
    name: 🚀 Production Deployment Trigger
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Confirmation Message
        run: |
          echo "========================================================="
          echo "Sportora V2 CI/CD Pipeline Passed All Quality Gates! 🏆"
          echo "Triggering Deployment Hook to Production Infrastructure..."
          echo "Commit SHA: ${{ github.sha }}"
          echo "========================================================="
