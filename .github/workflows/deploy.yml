name: Sportora V2 CI/CD Pipeline

on:
  push:
    branches:
      - frontend-redesign

  pull_request:
    branches:
      - frontend-redesign

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App
        working-directory: apps/web
        run: pnpm run build
        env:
          MONGODB_URI: "mongodb+srv://mock:mock@cluster.mongodb.net/test"
          JWT_SECRET: "ci_cd_test_secret"

      - name: Run API Tests
        working-directory: apps/api
        run: pnpm exec vitest run src
        env:
          MONGODB_URI: "mongodb+srv://mock:mock@cluster.mongodb.net/test"
          JWT_SECRET: "ci_cd_test_secret"

  deploy:
    name: Deploy to EC2
    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/frontend-redesign'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting Sportora deployment"
            echo "======================================"

            echo "Loading Node.js..."

            export PATH="/home/ubuntu/.nvm/versions/node/v24.20.0/bin:$PATH"

            COREPACK="/home/ubuntu/.nvm/versions/node/v24.20.0/bin/corepack"

            echo "Node version:"
            node --version

            echo "Corepack version:"
            $COREPACK --version

            cd /home/ubuntu/Projects/sportora-v2

            echo "Fetching latest code..."
            git fetch origin frontend-redesign

            echo "Resetting to latest GitHub commit..."
            git reset --hard origin/frontend-redesign

            echo "Installing dependencies..."
            $COREPACK pnpm install --frozen-lockfile

            echo "Building API..."
            cd apps/api
            $COREPACK pnpm run build

            echo "Building Web..."
            cd ../web
            rm -rf .next
            $COREPACK pnpm run build

            echo "Stopping existing services..."

            pkill -x next-server || true
            pkill -f "node dist/server.js" || true

            sleep 2

            echo "Starting API..."
            cd /home/ubuntu/Projects/sportora-v2/apps/api
            nohup $COREPACK pnpm start > /home/ubuntu/sportora-api.log 2>&1 &

            echo "Starting Web..."
            cd /home/ubuntu/Projects/sportora-v2/apps/web
            nohup $COREPACK pnpm start > /home/ubuntu/sportora-web.log 2>&1 &

            sleep 5

            echo "Checking API..."
            curl -f http://127.0.0.1:5000/health || curl -f http://127.0.0.1:5000 > /dev/null

            echo "Checking Web..."
            curl -f http://127.0.0.1:3000 > /dev/null

            echo "Checking Nginx..."
            sudo systemctl is-active --quiet nginx

            echo "======================================"
            echo "Sportora deployment successful!"
            echo "======================================"
